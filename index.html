<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>吹蠟燭</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#0d0814; --fg:#fff7ec; --muted:rgba(255,240,225,.68);
    --glass:rgba(34,20,44,.58); --line:rgba(255,220,190,.18);
    --accent:#ffb347; --accent2:#ff6f91; --ok:#5ee6a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;cursor:pointer}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 0;pointer-events:none;z-index:5}
  .top button{pointer-events:auto}
  .icon-btn{appearance:none;border:1px solid var(--line);background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;height:44px;min-width:44px;
    padding:0 16px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.round{padding:0;width:44px;font-size:20px}

  .hint{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 72px);text-align:center;
    color:var(--muted);font-size:15px;letter-spacing:.04em;transition:opacity .6s;pointer-events:none;z-index:4;
    text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .hint.off{opacity:0}

  .meter-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:min(360px,calc(100% - 32px));height:50px;display:flex;align-items:center;gap:12px;padding:0 18px;
    border-radius:999px;border:1px solid var(--line);background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:18px;z-index:5}
  .meter-pill .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
  .meter{position:relative;flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.13)}
  .meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
    background:linear-gradient(90deg,#4fd6a0,#ffd166)}
  .meter .fill.hot{background:linear-gradient(90deg,#ffd166,#ff5e3a);box-shadow:0 0 10px rgba(255,120,60,.7)}
  .meter .mark{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;
    box-shadow:0 0 6px rgba(255,255,255,.85)}
  .meter.big{height:16px;margin:10px 0 4px}
  .meter .amb{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:rgba(255,255,255,.35);border-radius:2px;
    transition:left .3s}
  .calib-btn{appearance:none;width:100%;height:48px;margin-top:12px;border-radius:14px;border:1px solid rgba(255,195,107,.55);
    background:rgba(255,195,107,.12);color:var(--fg);font-size:16px;font-weight:600}
  .calib{z-index:30}
  .calib .card{background:rgba(26,15,34,.97);border:1px solid var(--line);border-radius:22px;padding:26px 22px 20px}
  .calib .logo{font-size:52px;animation:none}
  .calib h2{margin:6px 0 8px;font-size:22px;letter-spacing:.08em}
  .calib p{min-height:3.4em}
  .prog{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
  .prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc36b,#ff7b8e)}
  .calib .ghost{margin-top:10px}
  .dbg{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 100px);z-index:7;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;
    color:#bfffd6;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre}
  .meter.big .mark{top:-7px;bottom:-7px}

  /* start overlay */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 40%,rgba(60,30,50,.72),rgba(8,4,12,.94) 70%);transition:opacity .5s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{width:min(380px,100%);text-align:center}
  .card .logo{font-size:64px;filter:drop-shadow(0 0 22px rgba(255,170,80,.75));animation:bob 2.4s ease-in-out infinite}
  .card h1{margin:8px 0 6px;font-size:30px;letter-spacing:.12em}
  .card p{margin:0 0 22px;color:var(--muted);line-height:1.7;font-size:15px}
  .card .err{margin:16px 0 0;color:#ffb4a8;font-size:14px;min-height:1em}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
  .primary{appearance:none;border:0;width:100%;height:54px;border-radius:16px;font-size:18px;font-weight:700;letter-spacing:.08em;
    background:linear-gradient(135deg,#ffc36b,#ff7b8e);color:#3a1020;box-shadow:0 8px 28px rgba(255,130,110,.35)}
  .primary:active{transform:scale(.98)}
  .ghost{appearance:none;margin-top:12px;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);
    background:transparent;font-size:15px;color:var(--muted)}

  /* celebration */
  .celebrate{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);z-index:6;text-align:center;
    pointer-events:none;transition:opacity .5s}
  .celebrate.hidden{opacity:0}
  .celebrate .msg{font-size:clamp(32px,10vw,56px);font-weight:900;letter-spacing:.06em;padding:0 12px;
    background:linear-gradient(90deg,#ffd166,#ff8fab,#a0c4ff,#ffd166);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(255,150,120,.45));animation:pop .7s cubic-bezier(.2,1.6,.4,1) both, shine 4s linear infinite}
  .celebrate .sub{margin-top:6px;color:var(--muted);font-size:16px;animation:fadeUp .8s .3s both}
  .celebrate button{pointer-events:auto;margin-top:16px;appearance:none;border:1px solid var(--line);background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;height:44px;padding:0 22px;font-size:16px;
    animation:fadeUp .8s .6s both}
  .celebrate.hidden button{pointer-events:none}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shine{to{background-position:300% 0}}
  @keyframes fadeUp{from{transform:translateY(10px);opacity:0}}

  /* settings sheet */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;transition:opacity .3s}
  .backdrop.hidden{opacity:0;pointer-events:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;width:min(560px,100%);
    max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:rgba(26,15,34,.97);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
    padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1);-webkit-user-select:none;user-select:none}
  .sheet.open{transform:none}
  .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:4px auto 10px}
  .sheet h2{margin:0 0 6px;font-size:20px;letter-spacing:.1em}
  .field{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .field>label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
  .field>label b{color:var(--fg);font-size:16px;margin-left:6px}
  .field.row{display:flex;align-items:center;justify-content:space-between}
  .field.row>label{margin:0;color:var(--fg);font-size:16px}
  .seg{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px}
  .seg button{flex:1;appearance:none;border:0;background:transparent;height:44px;border-radius:11px;font-size:16px;color:var(--muted)}
  .seg button.on{background:linear-gradient(135deg,#ffc36b,#ff7b8e);color:#3a1020;font-weight:700}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{appearance:none;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.07);font-size:26px;line-height:1}
  input[type=number],input[type=text]{appearance:none;-webkit-appearance:none;width:100%;height:52px;border-radius:14px;
    border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--fg);font-size:22px;text-align:center;
    font-weight:700;letter-spacing:.08em;outline:none;-webkit-user-select:text;user-select:text}
  input[type=text].msg{font-size:18px;font-weight:500}
  input:focus{border-color:var(--accent)}
  .stepper input{flex:1}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=range]{width:100%;height:36px;margin:6px 0 0;accent-color:var(--accent);background:transparent}
  .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .tip{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
  .switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:rgba(255,255,255,.18);
    position:relative;transition:background .2s;flex:none;margin:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .switch:checked{background:#ff9a76}
  .switch:checked::after{transform:translateX(20px)}
  .sheet .primary{margin-top:18px}
  .hidden-field{display:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="top">
  <button id="btnRelight" class="icon-btn" aria-label="全部重新點燃">🔥 重新點燃</button>
  <button id="btnSettings" class="icon-btn round" aria-label="設定">⚙️</button>
</header>
<div id="hint" class="hint">對著麥克風吹氣 🌬️</div>

<button id="meterPill" class="meter-pill" aria-label="吹氣強度，點一下調整靈敏度">
  <span id="micIc">🎤</span>
  <span class="meter"><span class="fill" id="pillFill"></span><span class="mark" id="pillMark"></span></span>
  <span class="lbl">靈敏度</span>
</button>

<div id="celebrate" class="celebrate hidden" aria-live="polite">
  <div class="msg" id="celebrateMsg">生日快樂！</div>
  <div class="sub">許個願吧 ✨</div>
  <button id="btnAgain">再點一次 🔥</button>
</div>

<div id="sheetBackdrop" class="backdrop hidden"></div>
<section id="sheet" class="sheet" aria-hidden="true" aria-label="設定">
  <div class="grab"></div>
  <h2>設定</h2>
  <div class="field">
    <label>蠟燭樣式</label>
    <div class="seg" id="modeSeg">
      <button data-mode="single">單支蠟燭</button>
      <button data-mode="number">數字蠟燭</button>
    </div>
  </div>
  <div class="field" id="fCount">
    <label>蠟燭數量（1–40）</label>
    <div class="stepper">
      <button id="cMinus" aria-label="減少">−</button>
      <input id="countInput" type="number" inputmode="numeric" min="1" max="40">
      <button id="cPlus" aria-label="增加">＋</button>
    </div>
  </div>
  <div class="field" id="fNumber">
    <label>要顯示的數字（最多 4 位）</label>
    <input id="numberInput" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例如 25">
  </div>
  <div class="field">
    <label>吹熄門檻 <b id="thVal">50</b></label>
    <div class="meter big"><span class="fill" id="bigFill"></span><span class="amb" id="bigAmb"></span><span class="mark" id="bigMark"></span></div>
    <input type="range" id="thSlider" min="5" max="95" step="1" aria-label="吹熄門檻">
    <div class="scale"><span>← 更敏感</span><span>需要更用力 →</span></div>
    <p class="tip">彩色條是「比周圍環境大聲多少」。吹氣讓它超過白線，蠟燭就會熄滅；淡灰線是最近環境噪音的高點，白線要放在它右邊。說話聲會被自動過濾。</p>
    <button id="btnCalib" class="calib-btn">🎯 自動校準（建議先做一次）</button>
  </div>
  <div class="field">
    <label>吹熄後的祝福文字</label>
    <input id="msgInput" class="msg" type="text" maxlength="24" autocomplete="off">
  </div>
  <div class="field row"><label for="sfxToggle">音效</label><input type="checkbox" id="sfxToggle" class="switch"></div>
  <div class="field row"><label for="songToggle">全部吹熄後播放生日快樂歌</label><input type="checkbox" id="songToggle" class="switch"></div>
  <button id="btnDone" class="primary">完成</button>
</section>

<div id="calib" class="overlay calib" hidden>
  <div class="card">
    <div class="logo" id="calIcon">🤫</div>
    <h2 id="calTitle">自動校準</h2>
    <p id="calText"></p>
    <div class="prog"><span id="calProg"></span></div>
    <div class="meter big"><span class="fill" id="calFill"></span></div>
    <button id="calBtn" class="primary" hidden>再試一次</button>
    <button id="calBtn2" class="ghost">取消</button>
  </div>
</div>

<div id="start" class="overlay">
  <div class="card">
    <div class="logo">🕯️</div>
    <h1>吹蠟燭</h1>
    <p>允許使用麥克風後，<br>對著手機底部的麥克風吹氣，就能把蠟燭吹熄。</p>
    <button id="btnStart" class="primary">開始 🎂</button>
    <button id="btnNoMic" class="ghost">不使用麥克風（點蠟燭吹熄）</button>
    <p class="err" id="startErr"></p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- settings ---------------- */
const KEY = 'blow-candle-v2';
const DEFAULTS = { mode: 'single', count: 5, number: '18', threshold: 40, msg: '生日快樂！', sfx: true, song: true, calibrated: false };
const S = Object.assign({}, DEFAULTS);
try {
  const raw = localStorage.getItem(KEY);
  if (raw) Object.assign(S, JSON.parse(raw));
  else {   // v1 used a different threshold scale: keep everything except the threshold
    const old = JSON.parse(localStorage.getItem('blow-candle-v1') || 'null');
    if (old) { delete old.threshold; Object.assign(S, old); }
  }
} catch (e) {}
// URL overrides, e.g. ?num=25 or ?count=3
try {
  const q = new URLSearchParams(location.search);
  if (q.has('num')) { S.mode = 'number'; S.number = q.get('num'); }
  if (q.has('count')) { S.mode = 'single'; S.count = +q.get('count'); }
  if (q.has('th')) S.threshold = +q.get('th');
} catch (e) {}
function sanitize() {
  S.mode = S.mode === 'number' ? 'number' : 'single';
  S.count = clamp(Math.round(+S.count) || 1, 1, 40);
  S.number = String(S.number || '').replace(/\D/g, '').slice(0, 4) || '1';
  S.threshold = clamp(Math.round(+S.threshold) || 40, 5, 95);
  S.msg = String(S.msg == null ? DEFAULTS.msg : S.msg).slice(0, 24);
  S.sfx = !!S.sfx; S.song = !!S.song; S.calibrated = !!S.calibrated;
}
sanitize();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- audio: output (synthesized) ---------------- */
let AC = null, master = null, noiseBuf = null;
function ensureAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume().catch(() => {}); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  master = AC.createGain(); master.gain.value = 0.9;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.3;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 1, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // iOS unlock: play one silent sample inside the user gesture
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050);
  s.connect(AC.destination); s.start(0);
  AC.resume().catch(() => {});
}
// shaped noise: filter chain with optional sweep + smooth attack/decay envelope
function noiseLayer(t, o) {
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  let node = src;
  for (const f of o.filters) {
    const b = AC.createBiquadFilter(); b.type = f.type; b.Q.value = f.q || 0.7;
    b.frequency.setValueAtTime(f.f0, t);
    if (f.f1) b.frequency.exponentialRampToValueAtTime(f.f1, t + (f.sweep || o.dur));
    node.connect(b); node = b;
  }
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(o.vol, t + o.attack);
  if (o.hold) g.gain.setValueAtTime(o.vol, t + o.attack + o.hold);
  g.gain.setTargetAtTime(0, t + o.attack + (o.hold || 0), o.decay);
  node.connect(g); g.connect(master);
  const end = t + o.attack + (o.hold || 0) + o.decay * 6;
  src.start(t, Math.random() * 0.8); src.stop(end);
  return end;
}
// sounds that reach the low band the detector listens to pause blow detection briefly
function muteDetector(until) { det.quietUntil = Math.max(det.quietUntil, until + 0.25); }
let puffTimes = [], lastWhoomp = 0;
function sfxPuff(k) {
  if (!S.sfx || !AC) return;
  const now = AC.currentTime;
  puffTimes = puffTimes.filter(x => now - x < 0.35); puffTimes.push(now);
  const v = (k || 1) / Math.sqrt(puffTimes.length);     // many candles at once stay soft
  // breathy "ffff" (air through lips), kept above 1 kHz: no thump
  noiseLayer(now, { filters: [{ type: 'highpass', f0: 900 }, { type: 'bandpass', f0: 2600, f1: 1500, q: 0.6, sweep: 0.45 }],
    vol: 0.2 * v, attack: 0.07, decay: 0.12, dur: 0.5 });
  // soft flutter of the dying flame
  noiseLayer(now + 0.05, { filters: [{ type: 'highpass', f0: 700 }, { type: 'bandpass', f0: 1300, f1: 1000, q: 1.2 }],
    vol: 0.05 * v, attack: 0.04, decay: 0.08, dur: 0.3 });
  // faint smoke hiss trailing off
  noiseLayer(now + 0.25, { filters: [{ type: 'highpass', f0: 3500 }, { type: 'bandpass', f0: 6500, f1: 5000, q: 0.5, sweep: 2.5 }],
    vol: 0.022 * v, attack: 0.35, hold: 0.4, decay: 0.6, dur: 2.5 });
}
function sfxStrike() {
  if (!S.sfx || !AC) return;
  const t = AC.currentTime;
  for (let i = 0; i < 4; i++) noiseLayer(t + i * 0.028 + Math.random() * 0.01,
    { filters: [{ type: 'highpass', f0: 3500 }], vol: 0.12, attack: 0.003, decay: 0.012, dur: 0.05 });
  const end = noiseLayer(t + 0.1, { filters: [{ type: 'highpass', f0: 1200 }, { type: 'bandpass', f0: 1800, f1: 2800, q: 0.7 }],
    vol: 0.12, attack: 0.06, decay: 0.15, dur: 0.4 });
  muteDetector(end);
}
function sfxWhoomp() {
  if (!S.sfx || !AC) return;
  const t = AC.currentTime; if (t - lastWhoomp < 0.05) return; lastWhoomp = t;
  const end = noiseLayer(t, { filters: [{ type: 'highpass', f0: 1000 }, { type: 'bandpass', f0: 1300, f1: 2600, q: 0.8 }],
    vol: 0.07, attack: 0.05, decay: 0.08, dur: 0.25 });
  muteDetector(end);
}
let songNodes = [];
function tone(freq, t, dur, vol, type) {
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 4.01; g2.gain.value = 0.18;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life += dt;
    if (p.life > p.max) { sparks.splice(i, 1); continue; }
    p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i]; p.life += dt;
    p.vx *= 1 - dt * 1.2; p.vy += 520 * dt; p.vy *= 1 - dt * 1.5;
    p.x += p.vx * dt + Math.sin(p.life * 4 + p.rot) * 30 * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + 30 || p.life > 7) confetti.splice(i, 1);
  }
}

/* ---------------- render ---------------- */
function render() {
  const t = st.t, amb = st.ambient;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b0613'); bg.addColorStop(0.6, '#1a0d22'); bg.addColorStop(1, '#120914');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const warm = ctx.createRadialGradient(G.cx, G.top - G.cw * 0.2, 0, G.cx, G.top - G.cw * 0.2, Math.max(W, H) * 0.75);
  warm.addColorStop(0, `rgba(255,150,70,${0.42 * amb})`); warm.addColorStop(0.45, `rgba(200,80,60,${0.14 * amb})`);
  warm.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
  for (const b of bokeh) {
    const x = b.x * W + Math.sin(t * 0.15 + b.s) * 14, y = b.y * H + Math.cos(t * 0.11 + b.s) * 10;
    const a = b.a * (0.35 + 0.65 * amb) * (0.75 + 0.25 * Math.sin(t * 0.8 + b.s * 3));
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, `rgba(${b.c},${a})`); g.addColorStop(0.7, `rgba(${b.c},${a * 0.6})`); g.addColorStop(1, `rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  drawTable(amb);
  drawCake(amb);

  // candles back to front
  for (const c of cands) {
    ctx.fillStyle = 'rgba(80,20,40,.25)';
    if (c.type === 'digit') { ctx.beginPath(); ctx.ellipse(c.x + 4, c.y + 1, c.w * 0.42, G.ry * 0.12 + 2, 0, 0, 7); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(c.x + c.w * 0.25, c.y + 2, c.w * 0.9, c.w * 0.2 + 2, 0, 0, 7); ctx.fill(); }
    if (c.type === 'digit') drawDigit(c); else drawStick(c);
    if (c.ember > 0) {
      const a = c.ember;
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(c.wickX, c.wickY, 0, c.wickX, c.wickY, 5 + c.fs * 0.12);
      g.addColorStop(0, `rgba(255,120,40,${a})`); g.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.wickX, c.wickY, 5 + c.fs * 0.12, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  // flames on top
  for (const c of cands) if (c.lit) drawFlame(c, t);

  // smoke
  for (const p of smoke) {
    const k = p.life / p.max, a = p.a * (1 - k) * Math.min(1, p.life * 6);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(205,200,215,${a})`); g.addColorStop(1, 'rgba(205,200,215,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const a = 1 - p.life / p.max;
    ctx.fillStyle = `rgba(255,${190 + 60 * a | 0},120,${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6 * a + 0.4, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of confetti) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.scale(Math.cos(p.life * 6 + p.rot), 1);
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, (7 - p.life) / 1.5);
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // vignette + darkness when candles are out
  const vg = ctx.createRadialGradient(G.cx, G.top, Math.min(W, H) * 0.25, G.cx, G.top, Math.max(W, H) * 0.85);
  vg.addColorStop(0, 'rgba(4,2,8,0)'); vg.addColorStop(1, `rgba(4,2,8,${0.55 + 0.3 * (1 - amb)})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(4,2,10,${0.38 * (1 - amb)})`; ctx.fillRect(0, 0, W, H);
}

function drawTable(amb) {
  const y = G.bottom + G.ry * 0.2;
  const g = ctx.createLinearGradient(0, y - G.ry, 0, H);
  g.addColorStop(0, '#2a1622'); g.addColorStop(1, '#140a10');
  ctx.fillStyle = g; ctx.fillRect(0, y - G.ry * 0.2, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const r = ctx.createRadialGradient(G.cx, y + G.ry, 0, G.cx, y + G.ry, G.cw);
  r.addColorStop(0, `rgba(255,150,80,${0.22 * amb})`); r.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = r; ctx.fillRect(0, y - G.ry, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

function drawCake(amb) {
  const { cx, rx, ry, top, bottom, ch } = G;
  // plate
  const py = bottom + ry * 0.15;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(cx, py + ry * 0.35, rx * 1.25, ry * 1.25, 0, 0, 7); ctx.fill();
  const pg = ctx.createLinearGradient(0, py - ry, 0, py + ry * 1.2);
  pg.addColorStop(0, '#f4ecf2'); pg.addColorStop(1, '#a99aa8');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(cx, py, rx * 1.2, ry * 1.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(cx, py - ry * 0.05, rx * 1.08, ry * 1.02, 0, 0, 7); ctx.fill();

  // body
  const bg = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  bg.addColorStop(0, '#b4466e'); bg.addColorStop(0.25, '#f394b4'); bg.addColorStop(0.45, '#ffb6cd');
  bg.addColorStop(0.75, '#e47aa0'); bg.addColorStop(1, '#8e2f55');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(cx - rx, top); ctx.lineTo(cx - rx, bottom);
  ctx.ellipse(cx, bottom, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(cx + rx, top); ctx.closePath(); ctx.fill();
  // pearl border at the bottom
  for (let i = 0; i <= 26; i++) {
    const a = Math.PI * i / 26, x = cx + Math.cos(a) * rx * 0.985, y = bottom - ch * 0.03 + Math.sin(a) * ry;
    const pr = ch * 0.045;
    const g = ctx.createRadialGradient(x - pr * 0.3, y - pr * 0.3, 0, x, y, pr);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e8c9d8');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.fill();
  }
  // ribbon dots
  for (let i = 1; i < 12; i++) {
    const a = Math.PI * i / 12, x = cx + Math.cos(a) * rx * 0.97, y = top + ch * 0.55 + Math.sin(a) * ry;
    ctx.fillStyle = i % 2 ? '#ffe28a' : '#9fe7ff';
    ctx.beginPath(); ctx.arc(x, y, ch * 0.03 * (0.5 + 0.5 * Math.sin(a)), 0, 7); ctx.fill();
  }
  // frosting with drips (front half)
  ctx.fillStyle = '#fff4f7';
  ctx.beginPath();
  ctx.moveTo(cx + rx * 1.01, top);
  const N = 80;
  for (let k = 0; k <= N; k++) {
    const u = k / N, a = Math.PI * u;
    let d = ch * 0.07;
    for (const dr of drips) { const z = (u - dr.c) / dr.w; d += Math.exp(-z * z * 1.6) * ch * dr.len; }
    ctx.lineTo(cx + Math.cos(a) * rx * 1.01, top + Math.sin(a) * ry + d * Math.pow(Math.sin(a), 0.4));
  }
  ctx.lineTo(cx - rx * 1.01, top);
  ctx.ellipse(cx, top, rx * 1.01, ry, 0, Math.PI, 0, false);
  ctx.closePath(); ctx.fill();
  // frosting shading
  const sg = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  sg.addColorStop(0, 'rgba(170,90,130,.35)'); sg.addColorStop(0.35, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(150,70,110,.4)');
  ctx.fillStyle = sg; ctx.fill();
  // top surface
  const tg = ctx.createRadialGradient(cx - rx * 0.2, top - ry * 0.3, 0, cx, top, rx);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#f6dde7');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(cx, top, rx, ry, 0, 0, 7); ctx.fill();
  // sprinkles
  ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.5, G.cw * 0.009);
  for (const s of sprinkles) {
    const x = cx + s.u * rx * 0.92, y = top + s.v * ry * 0.85, l = G.cw * 0.012;
    ctx.strokeStyle = s.c; ctx.beginPath();
    ctx.moveTo(x - Math.cos(s.a) * l, y - Math.sin(s.a) * l * 0.5); ctx.lineTo(x + Math.cos(s.a) * l, y + Math.sin(s.a) * l * 0.5); ctx.stroke();
  }
  // warm candle light on the cake
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(cx, top - ry, 0, cx, top, rx * 1.4);
  lg.addColorStop(0, `rgba(255,170,90,${0.3 * amb})`); lg.addColorStop(1, 'rgba(255,170,90,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(cx, top - ry, rx * 1.4, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';
}

function drawStick(c) {
  const { x, y, w, h } = c, top = y - h;
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, mix(c.color, 'k', 0.35)); g.addColorStop(0.35, mix(c.color, 'w', 0.4));
  g.addColorStop(0.6, c.color); g.addColorStop(1, mix(c.color, 'k', 0.45));
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x - w / 2, top); ctx.lineTo(x - w / 2, y); ctx.ellipse(x, y, w / 2, w * 0.18, 0, Math.PI, 0, true);
  ctx.lineTo(x + w / 2, top); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = w * 0.22;
  for (let s = top - w; s < y + w; s += w * 0.85) { ctx.beginPath(); ctx.moveTo(x - w, s + w * 0.6); ctx.lineTo(x + w, s - w * 0.6); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = mix(c.color, 'w', 0.55);
  ctx.beginPath(); ctx.ellipse(x, top, w / 2, w * 0.18, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2b1d16'; ctx.lineWidth = Math.max(1.2, w * 0.11); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, top); ctx.quadraticCurveTo(x + w * 0.08, top - w * 0.3, x + (c.lit ? 0 : w * 0.12), c.wickY); ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawDigit(c) {
  const sp = c.sprite;
  ctx.drawImage(sp.canvas, c.left, c.topY, sp.w, sp.h);
  ctx.strokeStyle = '#2b1d16'; ctx.lineWidth = Math.max(1.5, c.fs * 0.07); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(c.wickX, c.topY + sp.wickY + 2); ctx.quadraticCurveTo(c.wickX + 2, c.wickY + 4, c.wickX + (c.lit ? 0 : 2), c.wickY); ctx.stroke();
  ctx.lineCap = 'butt';
}

function teardrop(w, h, tip) {
  ctx.beginPath();
  ctx.moveTo(0, w * 0.55);
  ctx.bezierCurveTo(w * 1.15, w * 0.45, w * 0.75, -h * 0.45, tip, -h);
  ctx.bezierCurveTo(-w * 0.75, -h * 0.45, -w * 1.15, w * 0.45, 0, w * 0.55);
  ctx.closePath();
}
function drawFlame(c, t) {
  const e = c.ign < 1 ? 1 - Math.pow(1 - c.ign, 3) : 1;
  const wind = st.wind;
  const n1 = noise(t * 7 + c.phase), n2 = noise(t * 11.3 + c.phase * 1.7), n3 = noise(t * 17 + c.phase * 2.3);
  const hpK = 0.4 + 0.6 * c.hp;
  const s = c.fs * e * hpK;
  if (s < 0.5) return;
  const gust = Math.sin(t * 2.1 + c.phase) * 0.5 + (noise(t * 3 + c.phase) - 0.5) * 1.4 + c.bias;
  const lean = (n1 - 0.5) * 0.14 * (1 + wind * 2) + wind * 0.75 * gust;
  const h = s * (1 + (n2 - 0.5) * 0.16 * (1 + wind * 2.5) + Math.min(wind, 0.8) * 0.18 - Math.max(0, wind - 0.8) * 0.4);
  const w = s * 0.34 * (1 + (n3 - 0.5) * 0.12) * (1 - Math.min(wind, 1.2) * 0.18);
  const tip = (n3 - 0.5) * w * 0.9 * (1 + wind * 2) + lean * h * 0.35;
  const x = c.wickX, y = c.wickY + s * 0.06;
  const flick = 0.85 + 0.15 * n2;

  // glow
  ctx.globalCompositeOperation = 'lighter';
  const gx = x + Math.sin(lean) * h * 0.4, gy = y - h * 0.4;
  const gr = s * 3.2;
  const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
  gg.addColorStop(0, `rgba(255,190,90,${0.38 * flick * e})`); gg.addColorStop(0.35, `rgba(255,130,50,${0.14 * flick * e})`);
  gg.addColorStop(1, 'rgba(255,90,30,0)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(x, y); ctx.rotate(lean);
  // outer flame
  let g = ctx.createLinearGradient(0, w * 0.6, 0, -h);
  g.addColorStop(0, 'rgba(255,120,40,0.15)'); g.addColorStop(0.18, 'rgba(255,150,40,0.95)');
  g.addColorStop(0.55, 'rgba(255,200,80,0.95)'); g.addColorStop(0.85, 'rgba(255,120,30,0.7)'); g.addColorStop(1, 'rgba(255,70,20,0)');
  ctx.fillStyle = g; teardrop(w, h, tip); ctx.fill();
  // bright core
  g = ctx.createLinearGradient(0, w * 0.3, 0, -h * 0.7);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.25, 'rgba(255,252,235,0.95)');
  g.addColorStop(0.75, 'rgba(255,240,180,0.85)'); g.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = g; ctx.save(); ctx.translate(0, -h * 0.04); teardrop(w * 0.55, h * 0.7, tip * 0.6); ctx.fill(); ctx.restore();
  // blue base
  g = ctx.createRadialGradient(0, w * 0.2, 0, 0, w * 0.2, w * 0.9);
  g.addColorStop(0, 'rgba(90,140,255,0.75)'); g.addColorStop(1, 'rgba(60,90,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, w * 0.15, w * 0.6, w * 0.75, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); render(); updateMeters();
  requestAnimationFrame(frame);
}

// ---- auto calibration: 2 s of room noise, then 3 s of blowing ----
const calEl = $('calib');
function setCal(icon, title, text, prog, btn, btn2) {
  $('calIcon').textContent = icon; $('calTitle').textContent = title; $('calText').textContent = text;
  $('calProg').style.width = (prog * 100) + '%';
  $('calBtn').hidden = !btn; if (btn) $('calBtn').textContent = btn;
  $('calBtn2').textContent = btn2 || '取消';
}
function startCalib() {
  calEl.hidden = false;
  if (!micOk) { setCal('🎤', '需要麥克風', '目前沒有開啟麥克風，無法校準。請重新整理頁面，按「開始」並允許麥克風。', 0, null, '關閉'); return; }
  ensureAudio();
  det.calib = { phase: 'quiet', t: 0, quiet: [], blow: [] };
  setCal('🤫', '先保持安靜', '請安靜 2 秒，讓我聽聽周圍環境的聲音…', 0, null, '取消');
}
function pct(arr, q) { const a = arr.slice().sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(q * (a.length - 1)))]; }
function updateCalib(dt) {
  const c = det.calib; c.t += dt;
  if (c.phase === 'quiet') {
    c.quiet.push(det.lowDb);
    $('calProg').style.width = Math.min(100, c.t / 2 * 100) + '%';
    if (c.t >= 2) {
      c.phase = 'blow'; c.t = 0;
      det.floor = pct(c.quiet, 0.5);
      setCal('🌬️', '現在請吹氣', '像吹蠟燭一樣，對著手機底部的麥克風持續吹 3 秒。', 0, null, '取消');
    }
  } else {
    if (c.t > 0.3) c.blow.push(det.lowDb);
    $('calProg').style.width = Math.min(100, c.t / 3 * 100) + '%';
    if (c.t >= 3) finishCalib();
  }
}
function finishCalib() {
  const c = det.calib; det.calib = null;
  const qm = pct(c.quiet, 0.5), q95 = pct(c.quiet, 0.95), b = pct(c.blow, 0.6);
  const noise = Math.max(1, q95 - qm), blowEx = b - qm;
  if (!c.quiet.length || !c.blow.length || !isFinite(blowEx) || blowEx < noise + 6) {
    setCal('😕', '沒有聽到明顯的吹氣聲', '請把嘴靠近手機底部的麥克風（約 5–15 公分），再試一次。', 0, '再試一次', '關閉');
    return;
  }
  det.floor = qm; det.dose = 0; det.ambPeak = 0;
  const thDb = clamp(noise + 0.42 * (blowEx - noise), 4, 36);
  S.threshold = clamp(Math.round(thDb * DB_SCALE), 5, 95); S.calibrated = true;
  save(); updateMarks(); updateMicUI();
  setCal('✅', '校準完成', `你的吹氣比環境大聲約 ${Math.round(blowEx)} dB，門檻已設為 ${S.threshold}。之後用差不多的力道吹就能吹熄。`, 1, null, '好');
}
function closeCalib() { det.calib = null; calEl.hidden = true; }
$('btnCalib').addEventListener('click', startCalib);
$('calBtn').addEventListener('click', startCalib);
$('calBtn2').addEventListener('click', closeCalib);

// tap a candle: blow it out / relight it
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const px = e.clientX, py = e.clientY;
  let best = null, bd = 1e9;
  for (const c of cands) {
    const halfW = Math.max(c.w / 2 + 8, 22);
    const topY = c.wickY - c.fs * 1.2, botY = c.y + 8;
    if (Math.abs(px - c.x) < halfW && py > topY && py < botY) {
      const d = Math.abs(px - c.x) + Math.abs(py - (topY + botY) / 2) * 0.3;
      if (d < bd) { bd = d; best = c; }
    }
  }
  if (!best) return;
  if (best.lit) extinguish(best, 0.8);
  else if (!best.pending) {
    if (st.celebrated) { hideCelebrate(); stopSong(); st.celebrated = false; st.celebrateAt = 0; }
    ignite(best, false);
  }
});

// start
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function begin() {
  $('start').classList.add('hidden');
  setTimeout(() => { $('start').style.display = 'none'; }, 600);
  updateMicUI(); keepAwake();
  relightAll(true, false);
}
$('btnStart').addEventListener('click', async () => {
  ensureAudio();
  $('btnStart').disabled = true; $('btnStart').textContent = '正在開啟麥克風…';
  try {
    await startMic();
    begin();
  } catch (err) {
    console.warn('mic failed', err);
    let msg = '無法使用麥克風。';
    if (err && err.message === 'insecure') msg = '這個網址不是 HTTPS，瀏覽器不允許使用麥克風。請改用 https:// 網址開啟。';
    else if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
      let framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
      msg = framed ? '這個頁面嵌在別的網站裡（例如 claude.ai），那裡不允許使用麥克風。要用吹氣，請在自己的 HTTPS 網址開啟這個檔案。'
                   : '麥克風權限被拒絕了。請到瀏覽器的網站設定允許麥克風後重新整理。';
    }
    else if (err && err.name === 'NotFoundError') msg = '找不到麥克風裝置。';
    $('startErr').textContent = msg + ' 你也可以先用「點蠟燭吹熄」模式。';
    $('btnStart').disabled = false; $('btnStart').textContent = '再試一次 🎤';
  }
});
$('btnNoMic').addEventListener('click', () => { ensureAudio(); micOk = false; begin(); });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (AC && AC.state !== 'running') AC.resume().catch(() => {});
    keepAwake();
    last = performance.now();
  }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// debug / test hook
window.candleDebug = {
  setLevel(v) { forcedLevel = v == null ? null : +v; },
  state() {
    return { lit: cands.filter(c => c.lit).length, pending: cands.filter(c => c.pending).length, total: cands.length,
      level: Math.round(st.level), threshold: S.threshold, calibrating: !!det.calib, calibrated: S.calibrated,
      dbg: `ex${det.excess.toFixed(0)} v${det.voice.toFixed(2)} d${det.dose.toFixed(2)}`, mic: micOk, celebrated: st.celebrated,
      celebrateVisible: !celebrateEl.classList.contains('hidden'),
      boxes: cands.map(c => ({ x: Math.round(c.x), y: Math.round(c.y), wickX: Math.round(c.wickX), wickY: Math.round(c.wickY) })) };
  },
  calibrate: startCalib,
  calText() { return calEl.hidden ? null : $('calTitle').textContent + ' | ' + $('calText').textContent; }
};

genStatic();
resize();
buildCandles(false);
cands.forEach(c => { c.pending = false; c.lit = true; c.ign = 1; });
syncForm();
updateMicUI();
requestAnimationFrame(frame);
})();
</script>
